# İmaj yayını — sürüm etiketi atıldığında GHCR'a çok mimarili imaj basar.
#
# NEDEN ETİKETE BAĞLI: backend açılışta migration çalıştırıyor. `latest` her
# commit'te değişseydi, kullanıcının çektiği imaj ile deponun beklediği şema
# ayrışabilir ve teşhisi zor bir uyumsuzluk doğardı. Etiketle yayınlamak, imaj
# sürümü ile depo sürümünü birbirine bağlar.
#
# NEDEN İKİ MİMARİ: geliştirme çoğunlukla arm64 Mac'te, sunucular çoğunlukla
# amd64. Tek mimarili imaj yayınlamak, kullanıcıların yarısına
# "exec format error" vermek demektir.
#
# FRONTEND BİLİNÇLİ OLARAK YOK: arayüzün API adresi derleme anında bundle'a
# gömülüyor. Hazır bir frontend imajı `localhost:8080` ile mühürlenmiş olurdu ve
# portunu değiştiren ya da sunucuya kuran herkes boş ekran görürdü. Çalışma anı
# yapılandırması eklenmeden yayınlanmamalı.

name: İmaj yayını

on:
  push:
    tags: ["v*"]
  # Etiket atmadan denemek için elle tetikleme.
  workflow_dispatch:
    inputs:
      tag:
        description: "İmaj etiketi (ör. v0.1.0-test)"
        required: true

permissions:
  contents: read
  packages: write
  # Kaynağın hangi iş akışından çıktığını doğrulanabilir kılar.
  id-token: write
  attestations: write

jobs:
  imaj:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Derleme bağlamı proje köküdür: runner imajı .opencode/ altındaki
          # agent tanımlarını da kopyalıyor.
          - ad: runner
            dockerfile: runner/Dockerfile
            baglam: .
          - ad: backend
            dockerfile: backend/Dockerfile
            baglam: backend

    steps:
      - uses: actions/checkout@v4

      # amd64 dışındaki mimariyi emülasyonla derlemek için.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.ad }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.baglam }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.ad }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ad }}
          provenance: true
          sbom: true

      # İmajın gerçekten bu depodan ve bu iş akışından çıktığını kanıtlar.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.ad }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Yayınlanan imaj GERÇEKTEN çalışıyor mu? Etiket atıldıktan sonra "imaj bozuk"
  # geri bildirimi kullanıcıdan gelmemeli.
  duman-testi:
    needs: imaj
    runs-on: ubuntu-latest
    steps:
      # metadata-action semver etiketinden baştaki `v`yi DÜŞÜRÜR: `v0.1.0`
      # etiketi `0.1.0` imajı üretir. Buraya `github.ref_name` yazmak var olmayan
      # bir etiketi çekmeye çalışırdı — duman testi kendi hatasıyla düşerdi.
      - id: etiket
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deger=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "deger=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Yayınlanan runner imajını çek ve çalıştır
        run: |
          set -euo pipefail
          IMAJ="ghcr.io/${{ github.repository }}-runner:${{ steps.etiket.outputs.deger }}"
          docker pull "$IMAJ"
          # Betik dizini imajda hazır olmalı — tar kopyalaması dizin oluşturmuyor.
          docker run --rm --entrypoint ls "$IMAJ" -ld /home/agent/scripts
          docker run --rm --entrypoint opencode "$IMAJ" --version
          # Her iki mimari de yayınlanmış olmalı.
          docker buildx imagetools inspect "$IMAJ" | grep -q "linux/amd64"
          docker buildx imagetools inspect "$IMAJ" | grep -q "linux/arm64"
          echo "Runner imajı doğrulandı."

      - name: Yayınlanan backend imajını çek ve çalıştır
        run: |
          set -euo pipefail
          IMAJ="ghcr.io/${{ github.repository }}-backend:${{ steps.etiket.outputs.deger }}"
          docker pull "$IMAJ"
          docker buildx imagetools inspect "$IMAJ" | grep -q "linux/amd64"
          docker buildx imagetools inspect "$IMAJ" | grep -q "linux/arm64"
          echo "Backend imajı doğrulandı."
