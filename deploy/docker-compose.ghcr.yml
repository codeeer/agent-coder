# Hazır imajlarla çalıştırma — `make quickstart` bunu kullanır.
#
# Temel dosyanın ÜZERİNE biner: backend'in derleme bölümünü kaldırıp yayınlanmış
# imaja çevirir. `build: !reset null` olmadan compose iki tanımı birleştirir ve
# imaj adı verilmiş olsa bile kaynaktan derlemeye devam eder.
#
# FRONTEND BURADA YOK — bilinçli. Arayüzün API adresi derleme anında bundle'a
# gömüldüğü için hazır bir frontend imajı tek bir adrese mühürlü olurdu. Frontend
# yerelde derlenmeye devam eder (~1-2 dakika); asıl uzun adım olan runner imajı
# zaten çekiliyor.
#
# Runner bir compose servisi değildir: backend onu çalışma anında başlatır ve
# hangi imajı kullanacağını RUNNER_IMAGE ortam değişkeninden okur.

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/codeeer/agent-coder-backend:latest}
    build: !reset null
