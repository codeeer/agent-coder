# agent-coder — üretim benzeri yerel stack.
#
# Çalıştırma: proje kökünden `make up`
#
# opencode-runner burada servis DEĞİLDİR. Backend her agent adımı için o imajdan
# geçici bir container başlatır (sibling-container deseni) ve iş bitince siler.

name: agent-coder

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentcoder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentcoder_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agentcoder}
    ports:
      # Yerel psql erişimi için. Üretimde kaldırılmalı.
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentcoder} -d ${POSTGRES_DB:-agentcoder}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - internal

  backend:
    build:
      # Yollar proje köküne göredir — Makefile compose'u
      # --project-directory <repo kökü> ile çağırır, böylece kökteki .env okunur.
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKEND_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-agentcoder}:${POSTGRES_PASSWORD:-agentcoder_dev}@postgres:5432/${POSTGRES_DB:-agentcoder}?sslmode=disable
      # Tarayıcının arayüzü açtığı adres. PUBLIC_HOST ile birlikte değişir ki
      # sunucuya kurulumda CORS elle düzeltilmek zorunda kalmasın.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-3002}}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-agent-coder/opencode-runner:latest}
      RUNNER_NETWORK: agent-coder_internal
      # Kurumsal kök sertifika — YEDEK yol (SSL denetimi yapan ağlar için).
      #
      # ASIL YOL ARAYÜZ: Ayarlar → Kurumsal ağ. Bu değişken, sertifikayı
      # arayüzden girmeden önce kurulmuş sistemlerin bozulmaması için duruyor;
      # ayar doluysa o kazanır (spec 017).
      #
      # Doluysa backend dosyayı AÇILIŞTA OKUR ve içeriğini her runner
      # container'ına kopyalar. Dosya artık runner'a bağlanmıyor: bağlama,
      # dosyanın Docker host'unda bulunmasını gerektiriyordu ve uzak Docker
      # host kurulumunda çalışmıyordu.
      RUNNER_EXTRA_CA_CERT: ${RUNNER_EXTRA_CA_CERT:-}
      # ÖLÇÜM DÜZENEĞİ — scripts/sizinti-analizi/. Boşsa hiçbir etkisi yok.
      RUNNER_HTTP_PROXY: ${RUNNER_HTTP_PROXY:-}
      # Süre sınırı, eşzamanlılık, CPU ve bellek burada DEĞİL: davranış
      # parametreleri arayüzden yönetilir ve veritabanında tutulur.
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Runner container'larını başlatabilmek için (sibling-container deseni).
      # Bu, host üzerinde root eşdeğeri yetki demektir — üretimde uzak bir
      # Docker host'a veya kısıtlı bir sokete taşınmalı.
      - /var/run/docker.sock:/var/run/docker.sock
      # Kurumsal CA — yalnızca RUNNER_EXTRA_CA_CERT tanımlıysa anlamlı.
      # Backend dosyayı OKUMAK için görmek zorunda; `.env`'e yazılan yol
      # container içinde de geçerli olsun diye aynı yola bağlanıyor.
      # Salt okunur: sertifikayı değiştirmek arayüzün işi, container'ın değil.
      - ${RUNNER_EXTRA_CA_CERT:-/dev/null}:${RUNNER_EXTRA_CA_CERT:-/dev/null}:ro
    # Soket container içinde root:root 660'dır. Süreci root ÇALIŞTIRMAK yerine
    # yalnızca grup üyeliği veriyoruz: uid 10001 (appuser) olarak kalır ama
    # soketin grup iznine erişebilir.
    group_add:
      - "0"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Yalnızca yedek değer. Asıl adres aşağıdaki API_URL ile ÇALIŞMA ANINDA
        # veriliyor; bu yüzden aynı imaj her kuruluma uyar.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8080}}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # TARAYICIDAN görünen backend adresi — container adı değil.
      #
      # `NEXT_PUBLIC_` ÖNEKSİZ olması zorunlu: Next, o önekle başlayan her
      # okumayı derleme anında metne çeviriyor (sunucu bileşeninde bile). O adı
      # taşısaydı çalışma anında okuduğumuzu sanırken derleme değerini gömerdik.
      API_URL: ${NEXT_PUBLIC_API_URL:-http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8080}}
      # Arayüzde görünen ürün adı — kelime markası ve sekme başlığı.
      #
      # Buraya varsayılan YAZILMAZ; boş geçilir ve arayüz kendi varsayılanına
      # ("Agent Coder", frontend/src/lib/runtime-config.ts) düşer. İki yerde iki
      # varsayılan tutulsaydı er geç ayrışırlardı.
      #
      # API_URL gibi NEXT_PUBLIC_ öneksiz: değer imaja gömülmez, aynı imaj her
      # markayla çalışır.
      APP_NAME: ${APP_NAME:-}
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    networks:
      - internal

networks:
  internal:
    # Runner container'ları da bu ağa bağlanır; adı backend'e
    # RUNNER_NETWORK olarak geçilir.
    name: agent-coder_internal
    driver: bridge

volumes:
  postgres-data:
